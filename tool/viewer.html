<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据流图可视化</title>
<style>
:root{--bg:#f8fafc;--panel:#fff;--line:#e2e8f0;--line2:#cbd5e1;--text:#1e293b;--muted:#64748b;--accent:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);z-index:10}
header h1{font-size:15px;font-weight:600}header h1 small{color:var(--muted);font-weight:400;margin-left:8px;font-size:12px}
.btn{background:#fff;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{background:#f1f5f9;border-color:#94a3b8}.btn.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}.btn.primary:hover{background:#1d4ed8}
select{background:#fff;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-size:13px}
label.toggle{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
#stats{color:var(--muted);font-size:12.5px;margin-left:auto;display:flex;gap:14px;white-space:nowrap}#stats b{color:var(--text)}
main{flex:1;display:flex;position:relative}
#svg{width:100%;height:100%;display:block;cursor:grab;background:#fbfdff;background-image:linear-gradient(#f1f5f9 1px,transparent 1px),linear-gradient(90deg,#f1f5f9 1px,transparent 1px);background-size:26px 26px}
#svg:active{cursor:grabbing}
#legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;box-shadow:0 2px 8px rgba(15,23,42,.06)}
#legend .item{display:flex;align-items:center;gap:6px;color:var(--muted)}#legend .dot{width:11px;height:11px;border-radius:3px;border:1px solid rgba(15,23,42,.15)}
#hint{position:absolute;right:14px;bottom:14px;color:var(--muted);font-size:12px}
#detail{position:absolute;right:14px;top:14px;width:300px;max-height:calc(100% - 100px);background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:none;flex-direction:column;gap:10px;overflow:auto;box-shadow:0 8px 28px rgba(15,23,42,.12);z-index:5}
#detail.open{display:flex}#detail h3{font-size:14px;display:flex;align-items:center;justify-content:space-between}
#detail .close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}#detail .close:hover{color:var(--text)}
#detail .kv{display:grid;grid-template-columns:78px 1fr;gap:4px 8px;font-size:12.5px}#detail .kv dt{color:var(--muted)}
#detail pre{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;overflow:auto;max-height:200px;color:#334155}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:60}
.modal.open{display:flex}.modal .box{width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(15,23,42,.18)}
.modal h3{font-size:15px}.modal textarea{width:100%;height:220px;background:#f8fafc;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 monospace;resize:vertical}
.modal .actions{display:flex;justify-content:flex-end;gap:8px}
#tooltip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12px;z-index:50;display:none;box-shadow:0 6px 18px rgba(15,23,42,.12);max-width:260px}
.node{cursor:grab;transition:opacity .15s}.node.dragging{cursor:grabbing}.node.dim{opacity:.12}
.node rect{stroke-width:1.4;filter:drop-shadow(0 1px 2px rgba(15,23,42,.08))}
.node text{fill:#0f172a;text-anchor:middle;user-select:none}.node .nid{font-size:14px;font-weight:700}.node .nname{font-size:11px;opacity:.8}.node .nmeta{font-size:10px;opacity:.6}
.edge{transition:opacity .15s}.edge.dim{opacity:.08}
.edge.hl path{stroke-width:3 !important;filter:drop-shadow(0 0 4px rgba(37,99,235,.5))}
.edge path{fill:none;stroke:#94a3b8;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.edge.self path{stroke:#f59e0b;stroke-dasharray:5 4}.edge.external path{stroke:#dc2626;stroke-dasharray:6 5}
.edge .elabel{font-size:11px;fill:#334155;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.edge.hl .elabel{stroke:#dbeafe}
.hedge path{fill:none;stroke:#d946ef;stroke-width:1.6;stroke-dasharray:7 5;stroke-linejoin:round;stroke-linecap:round;opacity:.9;pointer-events:stroke}
.hedge.dim{opacity:.12}.hedge.hl path{stroke-width:3;filter:drop-shadow(0 0 4px rgba(217,70,239,.6))}
.hedge .hlabel{font-size:10.5px;fill:#a21caf;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px}
.tabs{display:flex;gap:4px;background:#f1f5f9;border:1px solid var(--line2);border-radius:8px;padding:2px}
.tab{border:none;background:transparent;padding:5px 12px;font-size:13px;border-radius:6px;color:var(--muted);cursor:pointer}
.tab.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.12)}.tab:disabled{opacity:.4;cursor:not-allowed}
#loadHint{color:var(--muted);font-size:11px}
.pin,.pout{pointer-events:stroke}.pin circle{fill:#3b82f6;stroke:#fff;stroke-width:1}.pout circle{fill:#f97316;stroke:#fff;stroke-width:1}
.pin text,.pout text{font-size:8.5px;fill:#475569;text-anchor:start;user-select:none}.pout text{text-anchor:end}
</style>
</head>
<body>
<header>
  <h1>数据流图可视化<small>Dataflow Graph Viewer</small></h1>
  <button class="btn primary" id="btnLoadMeta">载入 meta(可多)</button>
  <button class="btn" id="btnLoadPipeline">载入 pipeline</button>
  <button class="btn" id="btnLoadDag">载入 dag</button>
  <input type="file" id="metaInput" accept=".json,application/json" multiple hidden>
  <input type="file" id="pipelineInput" accept=".json,application/json" hidden>
  <input type="file" id="dagInput" accept=".json,application/json" hidden>
  <button class="btn" id="btnPaste">粘贴 JSON</button>
  <span class="tabs"><button class="tab active" id="tabDesign">设计图</button><button class="tab" id="tabRun">运行图</button></span>
  <span id="loadHint">点按钮/拖入 JSON 自动识别</span>
  <label class="toggle"><input type="checkbox" id="toggleSignal" checked>连线信号名</label>
  <label class="toggle"><input type="checkbox" id="toggleHist" checked>hist 依赖</label>
  <label class="toggle"><input type="checkbox" id="toggleTp" checked>tp 连线</label>
  <label class="toggle">布线<select id="edgeMode"><option value="smooth" selected>平滑曲线</option><option value="ortho">正交管道</option><option value="classic">经典贝塞尔</option></select></label>
  <span id="stats"><span>节点 <b id="stNodes">0</b></span><span>连线 <b id="stEdges">0</b></span><span>信号 <b id="stSignals">0</b></span><span>hist <b id="stHist">0</b></span><span>深度 <b id="stDepth">0</b></span></span>
  <button class="btn" id="btnFit">适应视图</button>
  <button class="btn" id="btnZoomIn">＋</button>
  <button class="btn" id="btnZoomOut">－</button>
</header>
<main>
  <svg id="svg" viewBox="0 0 800 600">
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#94a3b8"/></marker>
      <marker id="harrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#d946ef"/></marker>
    </defs>
    <g id="viewport"></g>
  </svg>
  <div id="legend">
    <div class="item"><span class="dot" style="background:#fef3c7;border-color:#f59e0b"></span>时间锚点 tp</div>
    <div class="item"><span class="dot" style="background:#d1fae5"></span>源 usr_src</div>
    <div class="item"><span class="dot" style="background:#dbeafe"></span>转发 usr_relay</div>
    <div class="item"><span class="dot" style="background:#e2e8f0"></span>汇 usr_sink</div>
    <div class="item"><span class="dot" style="background:#ede9fe"></span>分支 usr_fork</div>
    <div class="item"><span class="dot" style="background:#ccfbf1"></span>汇聚 usr_join</div>
    <div class="item"><span class="dot" style="background:#ffedd5"></span>反馈 usr_acc</div>
    <div class="item"><span class="dot" style="background:#fff;border:1.6px dashed #d946ef"></span>hist 隐式依赖</div>
  </div>
  <div id="hint">拖拽节点移动 · 拖拽空白平移 · 滚轮缩放 · 悬停高亮 · 点击查看详情</div>
  <div id="detail"></div>
</main>
<div id="tooltip"></div>
<div class="modal" id="pasteModal">
  <div class="box"><h3>粘贴 JSON 配置</h3>
    <textarea id="pasteText" placeholder='[ {"id":"cam","name":"usr_src", ...} ]'></textarea>
    <div class="actions"><button class="btn" id="pasteClose">取消</button><button class="btn primary" id="pasteOk">渲染</button></div>
  </div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const NODE_W=200,NODE_H=64,COL_GAP=240,ROW_GAP=36,PAD=60;
const TYPE_STYLE=[[/time/,{fill:'#fef9c3',stroke:'#facc15',text:'#854d0e'}],[/src/,{fill:'#d1fae5',stroke:'#34d399',text:'#065f46'}],[/relay/,{fill:'#dbeafe',stroke:'#60a5fa',text:'#1e40af'}],[/sink/,{fill:'#e2e8f0',stroke:'#94a3b8',text:'#334155'}],[/fork/,{fill:'#ede9fe',stroke:'#a78bfa',text:'#5b21b6'}],[/join/,{fill:'#ccfbf1',stroke:'#2dd4bf',text:'#115e59'}],[/acc/,{fill:'#ffedd5',stroke:'#fb923c',text:'#9a3412'}]];
function nodeStyle(n){for(const[r,s]of TYPE_STYLE)if(r.test(n))return s;return{fill:'#f1f5f9',stroke:'#94a3b8',text:'#334155'}}
const TYPECOL=[['#e0f2fe','#38bdf8','#0c4a6e'],['#dcfce7','#4ade80','#14532d'],['#fee2e2','#f87171','#7f1d1d'],['#ede9fe','#a78bfa','#4c1d95'],['#ffedd5','#fb923c','#7c2d12'],['#fce7f3','#f472b6','#831843'],['#cffafe','#22d3ee','#155e75'],['#fef9c3','#facc15','#713f12'],['#d1fae5','#34d399','#065f46'],['#e2e8f0','#94a3b8','#1e293b']];

function buildGraph(config){
  let rawNodes,rawEdges;const rawHistEdges=[];
  if(Array.isArray(config)){
    const prod={};config.forEach(n=>(n.outputs||[]).forEach(s=>prod[s]=n.id));rawNodes=config.map(n=>({...n}));rawEdges=[];
    config.forEach(n=>{
      const hist=n.hist||{};
      (n.inputs||[]).forEach(sig=>{
        const from=prod[sig];
        if(Object.prototype.hasOwnProperty.call(hist,sig)){
          // hist：窗口读该字段最近 win 帧 → 标为 hist 隐式依赖(反馈/历史边)，不进前序边
          rawHistEdges.push({from:from??null,to:n.id,port:sig,mode:'win',win:hist[sig],self:from===n.id,external:from===undefined});
          return;
        }
        rawEdges.push({from:from??null,to:n.id,signal:sig,message:null,self:from===n.id,external:from===undefined});
      });
    });
  }else if(config&&Array.isArray(config.vertices)&&Array.isArray(config.edges)){
    rawNodes=config.vertices.map(v=>({id:v.id,name:v.name,kind:v.kind,period:v.period,wcet:v.wcet,deadline:v.deadline,ddl:v.ddl,has_job:v.has_job,k:v.k,inputs:v.inputs,outputs:v.outputs,loop:v.loop,hyper_period_ms:config.hyper_period_ms,hyper_start_ms:config.hyper_start_ms}));
    rawEdges=config.edges.map(e=>({from:e.from,to:e.to,signal:e.tag,message:e.message,self:e.from===e.to,external:false}));
  }else throw new Error('无法识别的配置格式');
  const byId={};rawNodes.forEach(n=>byId[n.id]=n);
  rawEdges.forEach(e=>{if(!byId[e.from])e.external=true;});
  rawEdges.forEach(e=>{const f=byId[e.from],t=byId[e.to];if(f&&f.kind==='timepoint')e.timeLabel=f.id;else if(t&&t.kind==='timepoint')e.timeLabel=t.id;});
  if(config&&!Array.isArray(config)&&Array.isArray(config.hist_edges))config.hist_edges.forEach(h=>rawHistEdges.push({from:h.from,to:h.to,port:h.port,mode:h.mode,win:h.win,self:h.from===h.to,external:!byId[h.from]||!byId[h.to]}));
  if(!Array.isArray(config)&&S.pipeline){
    const pl=Array.isArray(S.pipeline)?S.pipeline:(S.pipeline.nodes||[]),pm={};pl.forEach(p=>pm[p.id]=p);
    rawNodes.forEach(n=>{if(Array.isArray(n.inputs)&&Array.isArray(n.outputs))return;const i=n.id.lastIndexOf(':');if(i<=0)return;const p=pm[n.id.slice(0,i)];if(p){n.inputs=p.inputs||[];n.outputs=p.outputs||[];n.task=p;}});
  }
  rawNodes.forEach(n=>{if(!Array.isArray(n.inputs)&&!Array.isArray(n.outputs))return;const lk=new Set([...Object.keys(n.loop||{}),...Object.keys(n.hist||{})]);n.inList=(n.inputs||[]).filter(p=>!lk.has(p));n.outList=n.outputs||[];n.anchorOk=n.inList.length<=MAX_PORTS&&n.outList.length<=MAX_PORTS;n.metaObj=S.meta[n.name]||null;});
  const group={},idx={};
  rawEdges.forEach(e=>{const k=(e.from??'∅')+'→'+e.to;group[k]=(group[k]||0)+1;});
  rawEdges.forEach(e=>{const k=(e.from??'∅')+'→'+e.to;e.offsetIndex=idx[k]=(idx[k]??0);e.offsetTotal=group[k];idx[k]++;});
  const isDag=!Array.isArray(config),depth={};
  if(isDag){
    const tpNo=id=>{const m=/^tp:(\d+)$/.exec(id||'');return m?+m[1]:-1;},instKey=id=>{const c=(id||'').indexOf(':');return c>0?id.slice(0,c):id;},instNo=id=>{const m=/:(\d+)$/.exec(id||'');return m?+m[1]:Infinity;};
    const tps=rawNodes.filter(n=>n.kind==='timepoint').sort((x,y)=>tpNo(x.id)-tpNo(y.id)),tpIdx={};tps.forEach((t,i)=>tpIdx[t.id]=i);
    const nTp=tps.length,tpStep=(nTp>1&&config.hyper_period_ms)?config.hyper_period_ms/nTp:0;
    tps.forEach((t,i)=>{t.anchorIdx=i;t.anchorOffsetMs=tpStep?Math.round(tpStep*i*100)/100:null;t.anchorAbsMs=(tpStep&&config.hyper_start_ms!=null)?config.hyper_start_ms+tpStep*i:null;});
    const rel={};
    rawEdges.forEach(e=>{const f=byId[e.from];if(f&&f.kind==='timepoint'&&byId[e.to]&&!(e.to in rel))rel[e.to]=f.id;});
    const nI={};rawNodes.forEach(n=>{if(n.kind==='job'){const k=instKey(n.id);if(!(k in nI))nI[k]=Object.keys(nI).length;}});
    const col={};
    rawNodes.forEach(n=>{if(n.kind==='timepoint'){depth[n.id]=tpIdx[n.id];n.tc=-1;return;}n.tc=nI[instKey(n.id)];const r=rel[n.id];if(r!=null){col[n.id]=tpIdx[r];depth[n.id]=tpIdx[r];}});
    const preds={};rawNodes.forEach(n=>{if(n.kind==='job')preds[n.id]=new Set();});
    rawEdges.forEach(e=>{const f=byId[e.from],t=byId[e.to];if(f&&t&&f.kind==='job'&&t.kind==='job')preds[t.id].add(f.id);});
    rawHistEdges.forEach(h=>{const f=byId[h.from],t=byId[h.to];if(f&&t&&f.kind==='job'&&t.kind==='job')preds[t.id].add(f.id);});
    const pend=rawNodes.filter(n=>n.kind==='job'&&col[n.id]==null);
    for(let r=0;r<pend.length+2;r++){let ch=false;pend.forEach(n=>{if(col[n.id]!=null)return;const ready=[...preds[n.id]].filter(p=>col[p]!=null);if(ready.length!==preds[n.id].size)return;col[n.id]=preds[n.id].size?1+Math.max(...ready.map(p=>col[p])):0;depth[n.id]=col[n.id];ch=true;});if(!ch)break;}
    pend.forEach(n=>{if(col[n.id]==null){col[n.id]=tps.length;depth[n.id]=tps.length;}});
    const byName={};rawNodes.forEach(n=>{if(n.kind==='job'){const k=instKey(n.id);(byName[k]=byName[k]||[]).push(n);}});
    Object.keys(byName).forEach(nm=>{byName[nm].sort((a,b)=>(instNo(a.id)-instNo(b.id))||(a.id<b.id?-1:1));for(let i=1;i<byName[nm].length;i++){const p=byName[nm][i-1],c=byName[nm][i];if(depth[c.id]<=depth[p.id])depth[c.id]=depth[p.id]+1;}});
  }else{
    // pipeline(设计视图)：Kahn 拓扑 + 最长路径层级 depth（并行/独立节点共享层，
    // 后续由蛇形折叠布局消化宽度）；hist 窗口读不属于前序边，已被排除。
    const indeg={},out={};
    rawNodes.forEach(n=>{indeg[n.id]=0;out[n.id]=new Set();});
    rawEdges.forEach(e=>{if(e.self||e.external)return;const f=byId[e.from],t=byId[e.to];if(!f||!t)return;out[f.id].add(t.id);indeg[t.id]++;});
    const less=(a,b)=>a<b?-1:a>b?1:0;
    const tq=rawNodes.filter(n=>indeg[n.id]===0).map(n=>n.id).sort(less);
    const topo=[],il={};rawNodes.forEach(n=>il[n.id]=indeg[n.id]);
    while(tq.length){const u=tq.shift();topo.push(u);out[u].forEach(v=>{if(--il[v]===0){tq.push(v);tq.sort(less);}});}
    rawNodes.forEach(n=>{if(topo.indexOf(n.id)<0)topo.push(n.id);});   // 防御残余(正常无环)
    const lev={};rawNodes.forEach(n=>lev[n.id]=0);
    topo.forEach(u=>out[u].forEach(v=>{if(lev[v]<lev[u]+1)lev[v]=lev[u]+1;}));
    rawNodes.forEach(n=>{depth[n.id]=lev[n.id];n.tc=lev[n.id];});
  }
  const outG={};rawEdges.forEach(e=>{if(e.from&&byId[e.from])outG[e.from]=(outG[e.from]||0)+1;});
  const outI={};rawEdges.forEach(e=>{if(e.from&&byId[e.from]){e.outIdx=outI[e.from]=(outI[e.from]??0);e.outCnt=outG[e.from];outI[e.from]++;}});
  const gutG={},gutI={};rawEdges.forEach(e=>{if(e.from&&byId[e.from]){const k=depth[e.from]+'>'+depth[e.to];gutG[k]=(gutG[k]||0)+1;}});
  rawEdges.forEach(e=>{if(e.from&&byId[e.from]){const k=depth[e.from]+'>'+depth[e.to];e.gutterIdx=gutI[k]=(gutI[k]??0);e.gutterCnt=gutG[k];gutI[k]++;}});
  return{nodes:rawNodes,edges:rawEdges,histEdges:rawHistEdges,byId,depth,isDag};
}

function layoutPipeline(g){
  const levels={};g.nodes.forEach(n=>{const d=g.depth[n.id]|0;(levels[d]=levels[d]||[]).push(n);});
  const R=Object.keys(levels).map(Number).sort((a,b)=>a-b);
  const L=R.map(d=>levels[d]);
  const cur={},setCur=()=>L.forEach(arr=>arr.forEach((n,i)=>cur[n.id]=i));
  const pre={},suc={};g.nodes.forEach(n=>{pre[n.id]=[];suc[n.id]=[];});
  g.edges.forEach(e=>{if(e.self||e.external)return;pre[e.to].push(e.from);suc[e.from].push(e.to);});
  const bary=nids=>{const ps=nids.filter(x=>x in cur);if(!ps.length)return null;return ps.reduce((s,x)=>s+cur[x],0)/ps.length;};
  const sortBy=(arr,key)=>arr.sort((a,b)=>{const A=key(a),B=key(b);if(A==null&&B==null)return 0;if(A==null)return 1;if(B==null)return -1;return A-B;});
  // 初始稳定序：按 id 尾号数字
  const num=k=>{const m=/(\d+)$/.exec(k||'');return m?+m[1]:0;};
  L.forEach(arr=>arr.sort((a,b)=>(num(a.id)-num(b.id))||(a.id<b.id?-1:1)));
  setCur();
  // 重心法去交叉：下行(依前驱) + 上行(依后继) 若干轮
  for(let rnd=0;rnd<3;rnd++){
    for(let ri=1;ri<L.length;ri++){sortBy(L[ri],n=>bary(pre[n.id]));setCur();}
    for(let ri=L.length-2;ri>=0;ri--){sortBy(L[ri],n=>bary(suc[n.id]));setCur();}
  }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  R.forEach((d,ri)=>{const arr=L[ri],cnt=arr.length,span=(cnt-1)*(NODE_H+ROW_GAP),x=PAD+ri*(NODE_W+COL_GAP);
    arr.forEach((n,i)=>{n.x=x;n.y=PAD+i*(NODE_H+ROW_GAP)-span/2;
      minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x+NODE_W);

function fit(bbox){bbox=bbox||layout(S.graph);const pad=70;S.view={x:bbox.x-pad,y:bbox.y-pad,w:bbox.w+pad*2,h:bbox.h+pad*2};applyView();}
function zoomAtCenter(k){const ax=S.view.x+0.5*S.view.w,ay=S.view.y+0.5*S.view.h,nw=S.view.w*k,nh=S.view.h*k;S.view.x=ax-0.5*nw;S.view.y=ay-0.5*nh;S.view.w=nw;S.view.h=nh;applyView();}
const tip=$('#tooltip');function showTip(e,html){tip.innerHTML=html;tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';}
function resetHighlight(){document.querySelectorAll('.node,.edge,.hedge').forEach(el=>el.classList.remove('dim','hl'));tip.style.display='none';}
function classifyShape(c){if(!c||typeof c!=='object')return null;if(Array.isArray(c))return'pipeline';if(Array.isArray(c.vertices)&&Array.isArray(c.edges))return'dag';if(Array.isArray(c.nodes))return'pipeline';if(c.name&&Array.isArray(c.inputs))return'pipeline';const k=Object.keys(c);if(k.length&&k.every(x=>c[x]&&typeof c[x]==='object'&&Array.isArray(c[x].params)))return'meta';return'pipeline';}
function addTyped(kind,data){if(kind==='meta')Object.assign(S.meta,data);else if(kind==='dag')S.dag=data;else if(kind==='pipeline')S.pipeline=data;renderAll();}
function addFile(n,d){addTyped(classifyShape(d),d);}
function setTabs(){$('#tabDesign').disabled=!S.pipeline;$('#tabRun').disabled=!S.dag;if(S.viewMode==='design'&&!S.pipeline&&S.dag)S.viewMode='run';if(S.viewMode==='run'&&!S.dag&&S.pipeline)S.viewMode='design';$('#tabDesign').classList.toggle('active',S.viewMode==='design');$('#tabRun').classList.toggle('active',S.viewMode==='run');}
function renderAll(){setTabs();const data=S.viewMode==='run'?S.dag:S.pipeline;S.graph=data?buildGraph(data):null;drawGraph();}
let pasteSeq=0;
window.addEventListener('DOMContentLoaded',()=>{
  const svg=$('#svg');
  function openDetail(n){const d=$('#detail');d.innerHTML='';const h=document.createElement('h3');h.innerHTML=`<span>节点详情 <span style="color:var(--muted);font-weight:400;font-size:12px">${n.name}</span></span>`;const cl=document.createElement('button');cl.className='close';cl.textContent='×';cl.onclick=()=>d.classList.remove('open');h.appendChild(cl);d.appendChild(h);const kv=document.createElement('dl');kv.className='kv';const rows=[['ID',n.id],['Name',n.name],['Kind',n.kind||'—'],['Period',n.period!=null?n1(n.period):'—'],['WCET',n.wcet!=null?n1(n.wcet):'—'],['Deadline',n.deadline!=null?n1(n.deadline):'—'],['k',n.k??'—'],['HyperPeriod',n.hyper_period_ms!=null?n1(n.hyper_period_ms):'—'],['AnchorOffset',n.anchorOffsetMs!=null?n1(n.anchorOffsetMs)+'ms':'—'],['AnchorAbs',n.anchorAbsMs!=null?n1(n.anchorAbsMs)+'ms':'—'],['Inputs',(n.inputs||[]).join(', ')||'—'],['Outputs',(n.outputs||[]).join(', ')||'—'],['Parameters',(n.parameters||[]).map(p=>JSON.stringify(p)).join(', ')||'—']];rows.forEach(([k,v])=>{if(v==='—')return;const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;kv.append(dt,dd);});d.appendChild(kv);const pre=document.createElement('pre');pre.textContent=JSON.stringify(n,null,2);d.appendChild(pre);d.classList.add('open');}
  const bindLoad=(btn,inputId,kind)=>{$(btn).addEventListener('click',()=>$(inputId).click());$(inputId).addEventListener('change',e=>{[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{try{addTyped(kind,JSON.parse(r.result));}catch(err){alert('解析 "'+f.name+'" 失败：'+err.message);}};r.readAsText(f);});e.target.value='';});};
  bindLoad('#btnLoadMeta','#metaInput','meta');bindLoad('#btnLoadPipeline','#pipelineInput','pipeline');bindLoad('#btnLoadDag','#dagInput','dag');
  window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>{e.preventDefault();[...e.dataTransfer.files].forEach(f=>{if(!/\.json$/i.test(f.name)&&f.type!=='application/json')return;const r=new FileReader();r.onload=()=>{try{addFile(f.name,JSON.parse(r.result));}catch(err){alert(`解析失败：${err.message}`);}};r.readAsText(f);});});
  $('#tabDesign').addEventListener('click',()=>{if(S.pipeline){S.viewMode='design';renderAll();}});$('#tabRun').addEventListener('click',()=>{if(S.dag){S.viewMode='run';renderAll();}});
  $('#toggleSignal').addEventListener('change',e=>{S.showSignalNames=e.target.checked;drawGraph();});$('#toggleHist').addEventListener('change',e=>{S.showHist=e.target.checked;drawGraph();});$('#toggleTp').addEventListener('change',e=>{S.showTp=e.target.checked;drawGraph();});$('#edgeMode').addEventListener('change',e=>{S.edgeMode=e.target.value;drawGraph();});
  $('#btnFit').addEventListener('click',()=>fit());$('#btnZoomIn').addEventListener('click',()=>zoomAtCenter(1/1.3));$('#btnZoomOut').addEventListener('click',()=>zoomAtCenter(1.3));
  $('#btnPaste').addEventListener('click',()=>$('#pasteModal').classList.add('open'));$('#pasteClose').addEventListener('click',()=>$('#pasteModal').classList.remove('open'));$('#pasteOk').addEventListener('click',()=>{try{const data=JSON.parse($('#pasteText').value);addFile('粘贴配置 #'+(++pasteSeq),data);$('#pasteText').value='';$('#pasteModal').classList.remove('open');}catch(err){alert('JSON 解析失败：'+err.message);}});
  svg.addEventListener('mousedown',e=>{if(e.target.closest('.node,.edge,.elabel,.hedge'))return;dragState={kind:'pan',x:e.clientX,y:e.clientY,vx:S.view.x,vy:S.view.y};});
  window.addEventListener('mousemove',e=>{if(!dragState)return;if(dragState.kind==='node'){const p=toSvgPoint(e.clientX,e.clientY),dx=p.x-dragState.startX,dy=p.y-dragState.startY;if(Math.abs(dx)+Math.abs(dy)>2)dragState.moved=true;if(dragState.moved){const n=dragState.node;n.x=dragState.baseX+dx;n.y=dragState.baseY+dy;applyNodePosition(n,dragState.group);redrawEdgesNow();}}else if(dragState.kind==='pan'){const r=svg.getBoundingClientRect();S.view.x=dragState.vx-(e.clientX-dragState.x)/r.width*S.view.w;S.view.y=dragState.vy-(e.clientY-dragState.y)/r.height*S.view.h;applyView();}});
  window.addEventListener('mouseup',()=>{if(dragState&&dragState.kind==='node'){dragState.group.classList.remove('dragging');if(!dragState.moved)openDetail(dragState.node);}dragState=null;});
  svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),k=e.deltaY>0?1.18:1/1.18,mx=(e.clientX-r.left)/r.width,my=(e.clientY-r.top)/r.height,ax=S.view.x+mx*S.view.w,ay=S.view.y+my*S.view.h,nw=Math.max(10,S.view.w*k),nh=Math.max(10,S.view.h*k);S.view.x=ax-mx*nw;S.view.y=ay-my*nh;S.view.w=nw;S.view.h=nh;applyView();},{passive:false});
});
</script>
</body>
</html>
